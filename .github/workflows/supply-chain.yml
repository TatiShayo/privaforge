name: Supply Chain Security Pipeline

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Secure Build and Package
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@f14e0f9978b4d66b6e2a2bb7a2d4b1f5d5df7921

      - name: Install Grype
        uses: anchore/scan-action/download-grype@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5
        id: grype

      - name: Install Cosign
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20

      - name: Generate SBOM
        run: syft . -o cyclonedx-json=sbom.json

      - name: Run Grype scan
        run: ${{ steps.grype.outputs.cmd }} sbom.json > cve-scan.txt

      - name: Package Release Artifact
        run: |
          git archive -o release.zip HEAD

      - name: Sign Release Artifact
        run: |
          cosign sign-blob --yes --bundle release.zip.sigstore.json release.zip

      - name: Attach SBOM Attestation
        run: |
          cosign attest-blob --yes --predicate sbom.json --type cyclonedx --bundle release.sbom.sigstore.json release.zip

      - name: Generate Hash for SLSA
        id: hash
        run: |
          echo "hashes=$(sha256sum release.zip | base64 -w0)" >> $GITHUB_OUTPUT

      - name: Upload secured artifacts
        uses: actions/upload-artifact@0b2256b8c012f0828dc542b3febcab082c67f72b
        with:
          name: secure-release-artifacts
          path: |
            release.zip
            sbom.json
            cve-scan.txt
            release.zip.sigstore.json
            release.sbom.sigstore.json

  provenance:
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@fb7f6df9f8565ed6fa01591df2af0c41e5573798
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: false
